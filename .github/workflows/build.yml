name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # `yes` exits on SIGPIPE; keep that from failing the step under pipefail.
          (yes || true) | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - name: Build, unit test and lint
        run: ./gradlew --no-daemon :app:assembleRelease :app:testDebugUnitTest :app:lintRelease

      - name: Build wallpaper helper
        run: |
          python3 tools/build-wallpaper-helper.py
          mkdir -p dist/folduo-wallpaper-setup
          cp tools/cover-wallpaper.py tools/cover-wallpaper-setup.jar LICENSE dist/folduo-wallpaper-setup/
          cp app/build/outputs/apk/release/app-release.apk dist/Folduo.apk
          (cd dist && sha256sum Folduo.apk folduo-wallpaper-setup/* > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@v5
        with:
          name: Folduo-apk
          path: |
            dist/Folduo.apk
            dist/SHA256SUMS
          if-no-files-found: error

      - uses: actions/upload-artifact@v5
        with:
          name: folduo-wallpaper-setup
          path: dist/folduo-wallpaper-setup/
          if-no-files-found: error

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore
